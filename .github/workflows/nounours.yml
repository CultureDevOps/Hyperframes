name: Render Nounours Antoine et Dany
on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload MP4 artifact only after separate approval'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HYPERFRAMES_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (verified 2026-11-01)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (verified 2026-11-01)
        with:
          node-version: '22'
      - name: Install pinned FFmpeg and verify baseline
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg=7:6.1.1-3ubuntu5
          python3 scripts/check_toolchain.py
      - name: Install HyperFrames
        run: npm ci --no-audit --no-fund
      - name: Render animated teddy
        working-directory: compositions/culturedevops/nounours
        run: npx --no-install hyperframes render --output renders/nounours-antoine-dany.mp4 --fps 30 --quality high
      - name: Compose video with cheerful original music
        working-directory: compositions/culturedevops/nounours
        run: |
          python3 ../../../scripts/generate_teddy_soundtrack.py soundtrack.wav
          ffmpeg -y -i renders/nounours-antoine-dany.mp4 -i soundtrack.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -t 10 -movflags +faststart renders/nounours-with-sound.mp4
          mv renders/nounours-with-sound.mp4 renders/nounours-antoine-dany.mp4
      - name: Verify MP4 metadata
        run: python3 scripts/verify_render.py compositions/culturedevops/nounours/renders/nounours-antoine-dany.mp4 --seconds 10
      - name: Verify bundled Chrome/FFmpeg baseline
        run: python3 scripts/check_toolchain.py --check-chrome
      - name: Upload teddy video
        if: ${{ inputs.upload_artifact == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (verified 2026-11-01)
        with:
          name: nounours-antoine-dany
          path: compositions/culturedevops/nounours/renders/nounours-antoine-dany.mp4
          if-no-files-found: error
          retention-days: 3
