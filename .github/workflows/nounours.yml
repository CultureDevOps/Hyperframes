name: Render Nounours Antoine et Dany
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install HyperFrames
        run: npm install --no-audit --no-fund
      - name: Render animated teddy
        working-directory: compositions/culturedevops/nounours
        run: npx --no-install hyperframes render --output renders/nounours-antoine-dany.mp4 --fps 30 --quality high
      - name: Compose video with cheerful original music
        working-directory: compositions/culturedevops/nounours
        run: |
          python3 ../../../scripts/generate_teddy_soundtrack.py soundtrack.wav
          ffmpeg -y -i renders/nounours-antoine-dany.mp4 -i soundtrack.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -t 10 -movflags +faststart renders/nounours-with-sound.mp4
          mv renders/nounours-with-sound.mp4 renders/nounours-antoine-dany.mp4
      - name: Verify landscape and sound
        working-directory: compositions/culturedevops/nounours
        run: |
          test -s renders/nounours-antoine-dany.mp4
          resolution="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 renders/nounours-antoine-dany.mp4)"
          echo "Resolution: $resolution"
          test "$resolution" = "1920x1080"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1 renders/nounours-antoine-dany.mp4 | grep -q 'codec_name=aac'
