name: OPS-010 — FFmpeg APT candidate probes (no install, no media)
on:
  pull_request:
    paths:
      - '.github/workflows/ops010-ffmpeg-probes.yml'
      - 'scripts/probe_ffmpeg_apt.py'
      - 'scripts/debian-trixie-image-lock.json'
      - 'scripts/ffmpeg-candidates.md'
      - 'scripts/debian-trixie-risk-review.md'
      - 'tests/test_ffmpeg_candidate_probe.py'
      - 'tests/test_debian_trixie_pilot.py'
permissions:
  contents: read
jobs:
  test:
    name: Offline candidate and OCI probe safety contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed 2026-11-01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # reviewed 2026-11-01
        with:
          python-version: '3.12'
      - name: Check Ubuntu metadata-only candidate parsing
        run: python -m unittest discover -s tests -p test_ffmpeg_candidate_probe.py -v
      - name: Check Debian pinned-digest/no-socket/no-install constraints
        run: python -m unittest discover -s tests -p test_debian_trixie_pilot.py -v

  probe-ubuntu-ffmpeg:
    name: Probe FFmpeg APT candidate on ${{ matrix.os }} (no install)
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (verified 2026-11-01)
      - name: Inspect signed Ubuntu APT metadata only
        run: |
          sudo apt-get update -qq
          python3 scripts/probe_ffmpeg_apt.py

  probe-debian-ffmpeg:
    name: Probe Debian 13 official amd64 digest (isolated no-install)
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Probe official Debian image with no mounted Docker socket
        run: |
          set -eu
          docker pull docker.io/library/debian@sha256:e2914ec98e08b24b4cee3cefcb9f90dfb5519f8d215a2ccf0c9a49b10b6e43de
          docker run --rm \
            --read-only \
            --cap-drop=ALL \
            --cap-add=SETUID \
            --cap-add=SETGID \
            --cap-add=CHOWN \
            --cap-add=FOWNER \
            --cap-add=DAC_OVERRIDE \
            --security-opt=no-new-privileges \
            --pids-limit=128 \
            --memory=512m \
            --tmpfs /var/lib/apt/lists:rw,nosuid,nodev,size=128m \
            --tmpfs /var/cache/apt:rw,nosuid,nodev,size=32m \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            docker.io/library/debian@sha256:e2914ec98e08b24b4cee3cefcb9f90dfb5519f8d215a2ccf0c9a49b10b6e43de sh -ec '
              set -eu
              grep -qx "ID=debian" /etc/os-release
              grep -qx "VERSION_CODENAME=trixie" /etc/os-release
              test "$(dpkg --print-architecture)" = amd64
              echo "DEBIAN_IMAGE_ARCH=amd64"
              apt-get update -qq
              apt-cache policy ffmpeg
              candidate="$(apt-cache policy ffmpeg | sed -n "s/^ *Candidate: //p")"
              test -n "$candidate"
              test "$candidate" != "(none)"
              echo "DEBIAN_FFMPEG_APT_CANDIDATE=$candidate"
              echo "SECURITY_STATUS=NOT_ASSESSED; NO_PACKAGE_INSTALLED; NO_MEDIA_RENDERED"
            '
