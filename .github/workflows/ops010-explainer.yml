name: OPS-010 - 720p explainer checks and gated neural release
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'compositions/culturedevops/chatgpt-gitlab/**'
      - 'scripts/render_chatgpt_gitlab.py'
      - 'scripts/ops010_voice.py'
      - 'tests/test_explainer.py'
      - 'tests/test_neural_voice.py'
      - '.github/workflows/ops010-explainer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explainer-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate storyboard, subtitles and non-publication rules
        run: |
          python -m unittest discover -s tests -p test_explainer.py -v
          python -m unittest discover -s tests -p test_neural_voice.py -v
          python -m py_compile scripts/render_chatgpt_gitlab.py
      - name: Render is intentionally local and no media is uploaded
        run: |
          echo 'NO_MEDIA_ARTIFACT: protected Android review uses the ChatGPT conversation attachment, not this public GitHub repo.'
  neural-smoke:
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned neural synthesis package
        run: python -m pip install --disable-pip-version-check 'piper-tts==1.8.0'
      - name: Download pinned French voice and verify integrity
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://huggingface.co/rhasspy/piper-voices/resolve/d5de91c972ba5a13cea0e77a63fda1623faac2c1/fr/fr_FR/siwis/medium'
          curl --fail --location --retry 2 --silent --show-error "$BASE/fr_FR-siwis-medium.onnx" -o "$RUNNER_TEMP/fr_FR-siwis-medium.onnx"
          curl --fail --location --retry 2 --silent --show-error "$BASE/fr_FR-siwis-medium.onnx.json" -o "$RUNNER_TEMP/fr_FR-siwis-medium.onnx.json"
          echo '641d1ab097da2b81128c076810edb052b385decc8be3381814802a64a73baf99  '"$RUNNER_TEMP/fr_FR-siwis-medium.onnx" | sha256sum --check
      - name: Synthesize only a synthetic French sentence, validate WAV, delete media
        shell: bash
        run: |
          set -euo pipefail
          export VOICE_MODEL="$RUNNER_TEMP/fr_FR-siwis-medium.onnx"
          export VOICE_OUT="$RUNNER_TEMP/ops010-tts-sample.wav"
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from ops010_voice import load_voice
          load_voice('piper',Path(os.environ['VOICE_MODEL'])).wav('Un chantier, un état vérifiable, une prochaine action claire.',Path(os.environ['VOICE_OUT']))
          PY
          python - <<'PY'
          import os, wave
          with wave.open(os.environ['VOICE_OUT'], 'rb') as w:
              rate, channels, frames = w.getframerate(), w.getnchannels(), w.getnframes()
          assert rate == 22050 and channels == 1 and frames > 22050, (rate, channels, frames)
          print(f'NEURAL_WAV_CHECK: {frames / rate:.2f}s, {rate}Hz mono PCM')
          PY
          test -s "$VOICE_OUT"
          echo 'NEURAL_FRENCH_WAV_OK; NO MEDIA UPLOAD'
          rm -f "$VOICE_OUT"

  public-neural-preview:
    # This job runs ONLY when OPS-010 PR #10's body has just received the
    # exact manual publication authorization. Normal pushes never publish.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'edited' &&
      github.event.pull_request.number == 10 &&
      github.event.pull_request.head.repo.full_name == 'CultureDevOps/Hyperframes' &&
      github.event.pull_request.head.ref == 'ops010/chatgpt-gitlab-explainer-720p-20261102' &&
      contains(github.event.pull_request.body, 'OPS010_PUBLIC_PIPER_VIDEO_APPROVED_20261102') &&
      !contains(github.event.changes.body.from, 'OPS010_PUBLIC_PIPER_VIDEO_APPROVED_20261102')
    needs: explainer-offline
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install renderer and pinned French neural TTS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check 'piper-tts==1.8.0' 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Download pinned Piper model and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://huggingface.co/rhasspy/piper-voices/resolve/d5de91c972ba5a13cea0e77a63fda1623faac2c1/fr/fr_FR/siwis/medium'
          curl --fail --location --retry 2 --silent --show-error "$BASE/fr_FR-siwis-medium.onnx" -o "$RUNNER_TEMP/fr_FR-siwis-medium.onnx"
          curl --fail --location --retry 2 --silent --show-error "$BASE/fr_FR-siwis-medium.onnx.json" -o "$RUNNER_TEMP/fr_FR-siwis-medium.onnx.json"
          echo '641d1ab097da2b81128c076810edb052b385decc8be3381814802a64a73baf99  '"$RUNNER_TEMP/fr_FR-siwis-medium.onnx" | sha256sum --check
      - name: Render 720p 30fps film with real Piper voice, subtitles and original soundtrack
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_chatgpt_gitlab.py \
            --voice piper \
            --piper-model "$RUNNER_TEMP/fr_FR-siwis-medium.onnx" \
            --output "$RUNNER_TEMP/continuityops-chatgpt-gitlab-piper-720p.mp4"
          test -s "$RUNNER_TEMP/continuityops-chatgpt-gitlab-piper-720p.mp4"
          test -s "$RUNNER_TEMP/continuityops-chatgpt-gitlab-piper-720p.srt"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,avg_frame_rate -of json "$RUNNER_TEMP/continuityops-chatgpt-gitlab-piper-720p.mp4"
          sha256sum "$RUNNER_TEMP/continuityops-chatgpt-gitlab-piper-720p.mp4"
      - name: Publish approved public preview as GitHub prerelease (not production)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tag="ops010-piper-preview-${HEAD_SHA:0:12}"
          if gh release view "$tag" --repo CultureDevOps/Hyperframes >/dev/null 2>&1; then
            echo "Release tag already exists, refusing replacement: $tag"
            exit 1
          fi
          gh release create "$tag" \
            "$RUNNER_TEMP/continuityops-chatgpt-gitlab-piper-720p.mp4" \
            "$RUNNER_TEMP/continuityops-chatgpt-gitlab-piper-720p.srt" \
            --repo CultureDevOps/Hyperframes \
            --target "$HEAD_SHA" \
            --title "ContinuityOps - ChatGPT GitLab, Piper FR (review preview)" \
            --notes "Preview 720p/30fps, French neural Piper Siwis voice, 8 chapters, subtitles and original music. Public review only, not production. Synthetic public editorial content, no secrets. Source: PR #10 at $HEAD_SHA. Speech: SIWIS French Speech Synthesis Database (2017), Yamagishi, Honnet, Garner and Lazaridis, University of Edinburgh; Piper contributors. Voice dataset CC BY 4.0; Piper engine GPL-3.0-or-later. The FFmpeg security debt remains open; no claim of full remediated baseline." \
            --prerelease
          echo "PUBLIC_PREVIEW_RELEASE_OK tag=$tag source=$HEAD_SHA"
