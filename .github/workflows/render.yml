name: Render Culture DevOps intro
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'compositions/culturedevops/intro/**'
      - 'package.json'
      - '.github/workflows/render.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check HyperFrames CLI
        run: npx hyperframes --help
      - name: Render
        working-directory: compositions/culturedevops/intro
        run: npx --no-install hyperframes render --output renders/culturedevops-intro.mp4 --fps 30 --quality high
      - name: Add original soundtrack and comic sound effects
        working-directory: compositions/culturedevops/intro
        run: |
          python3 ../../../scripts/generate_soundtrack.py soundtrack.wav
          ffmpeg -y -i renders/culturedevops-intro.mp4 -i soundtrack.wav \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k \
            -t 10 -movflags +faststart renders/culturedevops-with-sound.mp4
          mv renders/culturedevops-with-sound.mp4 renders/culturedevops-intro.mp4
      - name: Verify video is landscape Full HD
        working-directory: compositions/culturedevops/intro
        run: |
          test -s renders/culturedevops-intro.mp4
          resolution="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 renders/culturedevops-intro.mp4)"
          echo "Video resolution: $resolution"
          test "$resolution" = "1920x1080"\n          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1 renders/culturedevops-intro.mp4 | grep -q "codec_name=aac"
      - name: Upload rendered output and diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: culturedevops-render
          path: |
            compositions/culturedevops/intro/**/*.mp4
            compositions/culturedevops/intro/*.mp4
            renders/**/*.mp4
          if-no-files-found: error
