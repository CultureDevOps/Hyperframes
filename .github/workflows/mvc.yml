name: Render Culture DevOps MVC explainer
on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload MP4 artifact only after separate approval'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HYPERFRAMES_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned FFmpeg and verify baseline
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg=7:6.1.1-3ubuntu5
          python3 scripts/check_toolchain.py
      - name: Install HyperFrames
        run: npm ci --no-audit --no-fund
      - name: Render MVC explainer
        working-directory: compositions/culturedevops/mvc
        run: npx --no-install hyperframes render --output renders/mvc-explainer.mp4 --fps 30 --quality high
      - name: Add original soundtrack
        working-directory: compositions/culturedevops/mvc
        run: |
          python3 ../../../scripts/generate_mvc_soundtrack.py soundtrack.wav
          ffmpeg -y -i renders/mvc-explainer.mp4 -i soundtrack.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -t 35 -movflags +faststart renders/mvc-with-sound.mp4
          mv renders/mvc-with-sound.mp4 renders/mvc-explainer.mp4
      - name: Verify MP4 metadata
        run: python3 scripts/verify_render.py compositions/culturedevops/mvc/renders/mvc-explainer.mp4 --seconds 35
      - name: Verify bundled Chrome/FFmpeg baseline
        run: python3 scripts/check_toolchain.py --check-chrome
      - name: Upload MVC video
        if: ${{ inputs.upload_artifact == true }}
        uses: actions/upload-artifact@v4
        with:
          name: culturedevops-mvc-explainer
          path: compositions/culturedevops/mvc/renders/mvc-explainer.mp4
          if-no-files-found: error
          retention-days: 3
