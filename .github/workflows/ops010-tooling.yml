name: OPS-010 — Offline render contract and private review tests
on:
  pull_request:
    paths:
      - 'scripts/verify_render.py'
      - 'scripts/private_visual_review.py'
      - 'tests/test_verify_render.py'
      - 'tests/test_private_visual_review.py'
      - '.github/workflows/ops010-tooling.yml'
      - '.github/workflows/render.yml'
      - '.github/workflows/nounours.yml'
      - '.github/workflows/mvc.yml'
      - 'tests/test_render_workflow_policy.py'
      - 'package.json'
      - 'package-lock.json'
      - 'compositions/culturedevops/intro/index.html'
      - 'compositions/culturedevops/nounours/index.html'
      - 'compositions/culturedevops/mvc/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-offline:
    name: Python unit tests (no render or upload)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed 2026-11-01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # reviewed 2026-11-01
        with:
          python-version: '3.12'
      - name: Validate render workflows are manual-only without uploads
        run: python -m unittest discover -s tests -p test_render_workflow_policy.py -v
      - name: Render metadata contract (offline)
        run: python -m unittest discover -s tests -p test_verify_render.py -v
      - name: Private storyboard directory rules (offline)
        run: python -m unittest discover -s tests -p test_private_visual_review.py -v

  lint-compositions:
    name: Pinned npm lock and composition lints (no render)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      HYPERFRAMES_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed 2026-11-01
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # reviewed 2026-11-01
        with:
          node-version: '22'
      - name: Install immutable npm dependency tree
        run: npm ci --no-audit --no-fund
      - name: Verify HyperFrames exact package
        run: npm ls hyperframes --depth=0
      - name: Lint all three compositions without rendering
        run: |
          for composition in intro nounours mvc; do
            (cd "compositions/culturedevops/$composition" && npx --no-install hyperframes lint)
          done
