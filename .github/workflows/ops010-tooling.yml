name: OPS-010 — Offline render contract and private review tests
on:
  pull_request:
    paths:
      - 'scripts/verify_render.py'
      - 'scripts/private_visual_review.py'
      - 'tests/test_verify_render.py'
      - 'tests/test_private_visual_review.py'
      - '.github/workflows/ops010-tooling.yml'
      - '.github/workflows/render.yml'
      - '.github/workflows/nounours.yml'
      - '.github/workflows/mvc.yml'
      - 'tests/test_render_workflow_policy.py'
      - 'package.json'
      - 'package-lock.json'
      - 'compositions/culturedevops/intro/index.html'
      - 'compositions/culturedevops/nounours/index.html'
      - 'compositions/culturedevops/mvc/index.html'
      - 'scripts/render_and_review.ps1'
      - 'scripts/private_output_acl.ps1'
      - 'tests/test_render_and_review_ps1.py'
      - 'tests/test_windows_acl.ps1'
      - 'scripts/local-windows-review.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-offline:
    name: Python unit tests (no render or upload)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed 2026-11-01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # reviewed 2026-11-01
        with:
          python-version: '3.12'
      - name: Validate render workflows are manual-only without uploads
        run: python -m unittest discover -s tests -p test_render_workflow_policy.py -v
      - name: Render metadata contract (offline)
        run: python -m unittest discover -s tests -p test_verify_render.py -v
      - name: Private storyboard directory rules (offline)
        run: python -m unittest discover -s tests -p test_private_visual_review.py -v
      - name: Validate offline PowerShell and Windows safety contract
        run: python -m unittest discover -s tests -p test_render_and_review_ps1.py -v
      - name: Exercise Linux PowerShell plan mode only (no media)
        run: |
          pwsh -NoProfile -File scripts/render_and_review.ps1 -Composition mvc -PlanOnly
          pwsh -NoProfile -File scripts/render_and_review.ps1 -Composition intro -PlanOnly -ExistingMp4 not-opened.mp4


  lint-compositions:
    name: Pinned npm lock and composition lints (no render)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      HYPERFRAMES_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed 2026-11-01
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # reviewed 2026-11-01
        with:
          node-version: '22'
      - name: Install immutable npm dependency tree
        run: npm ci --no-audit --no-fund
      - name: Verify HyperFrames exact package
        run: npm ls hyperframes --depth=0
      - name: Lint all three compositions without rendering
        run: |
          for composition in intro nounours mvc; do
            (cd "compositions/culturedevops/$composition" && npx --no-install hyperframes lint)
          done

  test-windows-local:
    name: Native Windows PowerShell and NTFS (no media)
    if: github.event_name == 'pull_request'
    needs: test-offline
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed 2026-11-01
      - name: Windows PowerShell 5.1 plan-only; no render
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected PowerShell 5.1' }
          .\scripts\render_and_review.ps1 -Composition intro -PlanOnly
          .\scripts\render_and_review.ps1 -Composition mvc -PlanOnly
          .\scripts\render_and_review.ps1 -Composition nounours -PlanOnly -ExistingMp4 not-opened.mp4
      - name: Windows PowerShell 5.1 NTFS privacy tests (synthetic bytes)
        shell: powershell
        run: .\tests\test_windows_acl.ps1
      - name: PowerShell 7 compatibility plan-only; no render
        shell: pwsh
        run: |
          .\scripts\render_and_review.ps1 -Composition nounours -PlanOnly
          .\scripts\render_and_review.ps1 -Composition intro -PlanOnly
      - name: PowerShell 7 NTFS privacy and interruption tests (synthetic bytes)
        shell: pwsh
        run: .\tests\test_windows_acl.ps1
