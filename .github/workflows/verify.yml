name: Validate render tooling (no video)
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test render metadata checks and workflow boundaries
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies (no render)
        run: npm ci --no-audit --no-fund
      - name: Check HyperFrames CLI
        env:
          HYPERFRAMES_NO_UPDATE_CHECK: '1'
        run: |
          npm ls hyperframes --depth=0
          npx --no-install hyperframes --help > /dev/null
